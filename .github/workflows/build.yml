name: build-apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ ! -x "$SM" ]; then
            echo "sdkmanager не найден, качаю cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "--- платформы ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: Создать исходники
        run: bash make.sh .

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Отдать APK
        uses: actions/upload-artifact@v4
        with:
          name: VeniceAutoPilot-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Сохранить исходники в репозиторий
        continue-on-error: true
        run: |
          git config user.name "autobuild"
          git config user.email "autobuild@users.noreply.github.com"
          git add -A
          git commit -m "generated project" || true
          git push
