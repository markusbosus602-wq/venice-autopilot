name: build-apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Создать исходники
        run: bash make.sh .

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon

      - name: Отдать APK
        uses: actions/upload-artifact@v4
        with:
          name: VeniceAutoPilot-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Сохранить исходники в репозиторий
        continue-on-error: true
        run: |
          git config user.name "autobuild"
          git config user.email "autobuild@users.noreply.github.com"
          git add -A
          git commit -m "generated project" || true
          git push
